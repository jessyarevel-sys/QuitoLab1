<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">Ciudad Lab logo horizontal</title>
  <desc id="desc">Lockup horizontal extendido de Ciudad Lab.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Inter:wght@600&amp;display=swap');
    .word{font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;letter-spacing:-2.4px}
    .sub{font-family:'Inter',Arial,sans-serif;font-weight:600;letter-spacing:2px}
  </style>
  <rect width="1200" height="200" fill="#F4EFE6"/>
  <g transform="translate(40 30)">
    <circle cx="70" cy="70" r="56" fill="none" stroke="#102A43" stroke-width="12"/>
    <circle cx="70" cy="70" r="18" fill="#F4EFE6" stroke="#102A43" stroke-width="10"/>
    <path d="M70 14 L70 52 M70 88 L70 126 M14 70 L52 70 M88 70 L126 70" stroke="#102A43" stroke-width="10" stroke-linecap="round"/>
    <circle cx="70" cy="14" r="14" fill="#64B6AC" stroke="#102A43" stroke-width="8"/>
    <circle cx="126" cy="70" r="14" fill="#C96F3D" stroke="#102A43" stroke-width="8"/>
    <circle cx="70" cy="126" r="14" fill="#3A7D44" stroke="#102A43" stroke-width="8"/>
    <circle cx="14" cy="70" r="14" fill="#F4EFE6" stroke="#102A43" stroke-width="8"/>
  </g>
  <text x="205" y="91" class="word" font-size="62" fill="#102A43">Ciudad Lab</text>
  <line x1="520" y1="55" x2="520" y2="140" stroke="#C96F3D" stroke-width="4" stroke-linecap="round"/>
  <text x="555" y="84" class="sub" font-size="16" fill="#1F5673">CONECTA TALENTO, EVIDENCIA Y PROYECTOS</text>
  <text x="555" y="116" class="sub" font-size="16" fill="#1F5673">PARA TRANSFORMAR QUITO</text>
</svg>
