<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">Ciudad Lab logo monocromo</title>
  <desc id="desc">Logo monocromo que usa currentColor.</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Inter:wght@600&amp;display=swap');
    .word{font-family:'Space Grotesk',Arial,sans-serif;font-weight:700;letter-spacing:-2px}
    .sub{font-family:'Inter',Arial,sans-serif;font-weight:600;letter-spacing:1.8px}
  </style>
  <g color="currentColor">
    <g transform="translate(44 28)" fill="none" stroke="currentColor">
      <circle cx="72" cy="72" r="58" stroke-width="12"/>
      <circle cx="72" cy="72" r="19" stroke-width="10"/>
      <path d="M72 14 L72 53 M72 91 L72 130 M14 72 L53 72 M91 72 L130 72" stroke-width="10" stroke-linecap="round"/>
      <circle cx="72" cy="14" r="15" fill="currentColor" stroke-width="8"/>
      <circle cx="130" cy="72" r="15" fill="currentColor" stroke-width="8"/>
      <circle cx="72" cy="130" r="15" fill="currentColor" stroke-width="8"/>
      <circle cx="14" cy="72" r="15" fill="none" stroke-width="8"/>
    </g>
    <text x="210" y="92" class="word" font-size="58" fill="currentColor">Ciudad Lab</text>
    <text x="214" y="130" class="sub" font-size="15" fill="currentColor">PROYECTOS TERRITORIALES CON CONFIANZA</text>
  </g>
</svg>
